<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Toolbar</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #1c1c1e;
        color: #e5e5e7;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 48px;
        padding: 0 8px;
        background: #1c1c1e;
        border-bottom: 1px solid #3a3a3c;
      }

      .nav-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #e5e5e7;
        cursor: pointer;
        transition: background-color 0.15s;
      }

      .nav-button:hover:not(:disabled) {
        background: #3a3a3c;
      }

      .nav-button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .nav-button svg {
        width: 16px;
        height: 16px;
      }

      .spinner {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .url-bar {
        flex: 1;
        margin-left: 8px;
        padding: 6px 12px;
        background: #2c2c2e;
        border: 1px solid #3a3a3c;
        border-radius: 6px;
        overflow: hidden;
      }

      .url-text {
        display: block;
        font-size: 13px;
        color: #8e8e93;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        user-select: text;
        cursor: text;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="back-btn" class="nav-button" title="Go back" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>

      <button id="forward-btn" class="nav-button" title="Go forward" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>

      <button id="refresh-btn" class="nav-button" title="Refresh">
        <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
        <svg id="loading-icon" class="spinner" style="display: none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
      </button>

      <div class="url-bar">
        <span id="url-text" class="url-text"></span>
      </div>
    </div>

    <script>
      const backBtn = document.getElementById('back-btn');
      const forwardBtn = document.getElementById('forward-btn');
      const refreshBtn = document.getElementById('refresh-btn');
      const refreshIcon = document.getElementById('refresh-icon');
      const loadingIcon = document.getElementById('loading-icon');
      const urlText = document.getElementById('url-text');

      let isLoading = false;

      // Navigation handlers
      backBtn.addEventListener('click', () => {
        window.toolbarApi?.navigateBack();
      });

      forwardBtn.addEventListener('click', () => {
        window.toolbarApi?.navigateForward();
      });

      refreshBtn.addEventListener('click', () => {
        if (isLoading) {
          window.toolbarApi?.stop();
        } else {
          window.toolbarApi?.reload();
        }
      });

      // Update UI based on state
      function updateState(state) {
        backBtn.disabled = !state.canGoBack;
        forwardBtn.disabled = !state.canGoForward;
        urlText.textContent = state.url;
        urlText.title = state.url;

        isLoading = state.isLoading;
        if (state.isLoading) {
          refreshIcon.style.display = 'none';
          loadingIcon.style.display = 'block';
          refreshBtn.title = 'Stop loading';
        } else {
          refreshIcon.style.display = 'block';
          loadingIcon.style.display = 'none';
          refreshBtn.title = 'Refresh';
        }
      }

      // Listen for state updates from main process
      if (window.toolbarApi) {
        window.toolbarApi.onStateUpdate(updateState);
      }
    </script>
  </body>
</html>
